{{- if hasKey .Values.atelet "nodeSelector" -}}
{{- fail "move substrate.atelet.nodeSelector to substrate.worker.nodeSelector (shared by atelet and workers)" -}}
{{- end }}
{{- if ne (empty .Values.atelet.imageCredentialProviderConfig) (empty .Values.atelet.imageCredentialProviderBinDir) -}}
{{- fail "set both substrate.atelet.imageCredentialProviderConfig and substrate.atelet.imageCredentialProviderBinDir" -}}
{{- end }}
