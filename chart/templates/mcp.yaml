{{- if include "obot.mcpOnKubernetes" . }}
{{- include "obot.validatePodSecurityLevels" . -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "obot.config.mcpNamespace" . }}
  {{- with .Values.mcpNamespace.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "obot.labels" . | nindent 4 }}
    {{- if .Values.mcpNamespace.podSecurity.enabled }}
    pod-security.kubernetes.io/enforce: {{ .Values.mcpNamespace.podSecurity.enforce }}
    pod-security.kubernetes.io/enforce-version: {{ .Values.mcpNamespace.podSecurity.enforceVersion | quote }}
    pod-security.kubernetes.io/audit: {{ .Values.mcpNamespace.podSecurity.audit }}
    pod-security.kubernetes.io/audit-version: {{ .Values.mcpNamespace.podSecurity.auditVersion | quote }}
    pod-security.kubernetes.io/warn: {{ .Values.mcpNamespace.podSecurity.warn }}
    pod-security.kubernetes.io/warn-version: {{ .Values.mcpNamespace.podSecurity.warnVersion | quote }}
    {{- end }}
{{- range .Values.mcpImagePullSecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ include "obot.config.mcpNamespace" $ }}
  labels:
    {{- include "obot.labels" $ | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"email\":\"%s\",\"auth\":\"%s\"}}}" .registry .username .password .email (printf "%s:%s" .username .password | b64enc) | b64enc }}
{{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ include "obot.config.mcpNamespace" . }}
  name: obot-mcp-role
  labels:
    {{- include "obot.labels" . | nindent 4 }}
rules:
  # access to leases for leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "services", "persistentvolumeclaims", "configmaps"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  # The hosted agent terminal joins a sandbox's console. It attaches to the
  # container the harness was started with rather than exec'ing a second
  # process, so this is pods/attach and not pods/exec.
  - apiGroups: [""]
    resources: ["pods/attach"]
    verbs: ["create", "get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["networking.aviatrix.com"]
    resources: ["firewallpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # ResourceQuota access for capacity info, and for hosted agent pools,
  # whose pool budgets are ResourceQuotas scoped to a per-pool PriorityClass.
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # Hosted agent sandbox volume cleanup runs as a Job.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

---
# PriorityClasses are cluster-scoped, so the per-pool objects backing hosted
# agent pools cannot live in a namespaced Role. Each one is created with
# an owner reference to the sandbox namespace, so deleting that namespace
# collects them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-obot-agent-clusterrole
  labels:
    {{- include "obot.labels" . | nindent 4 }}
rules:
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # Needed to read the sandbox namespace's UID when building those owner
  # references, and to create it when hosted agents are the only Kubernetes
  # feature enabled.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "watch"]
  # Only read when Obot's own hostname is a loopback address, which is a
  # developer running outside the cluster: a sandbox cannot reach 127.0.0.1, so
  # a node address is substituted. Harmless to omit in production, where the
  # configured hostname already resolves.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # Live per-sandbox CPU and memory for hosted agent pools.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Pool volume usage comes from kubelet's stats summary, reached through the
  # API server proxy. This grant is broader than it looks -- nodes/proxy can
  # reach other kubelet endpoints too -- so withhold it if pool disk reporting
  # is not wanted. The backend degrades to omitting disk rather than failing.
  - apiGroups: [""]
    resources: ["nodes/proxy", "nodes/stats"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-obot-agent-clusterrolebinding
  labels:
    {{- include "obot.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "obot.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-obot-agent-clusterrole
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: {{ include "obot.config.mcpNamespace" . }}
  name: obot-mcp-rolebinding
  labels:
    {{- include "obot.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "obot.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: obot-mcp-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ .Release.Namespace }}
  name: obot-runtime-role
  labels:
    {{- include "obot.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: {{ .Release.Namespace }}
  name: obot-runtime-rolebinding
  labels:
    {{- include "obot.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "obot.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: obot-runtime-role
  apiGroup: rbac.authorization.k8s.io

{{- if .Values.mcpNamespace.resourceQuota }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: obot-mcp-resourcequota
  namespace: {{ include "obot.config.mcpNamespace" . }}
spec:
  {{- toYaml .Values.mcpNamespace.resourceQuota | nindent 2 }}
{{- end }}
{{- end }}
