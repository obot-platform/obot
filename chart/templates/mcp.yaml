{{- if include "obot.mcpOnKubernetes" . }}
{{- include "obot.validatePodSecurityLevels" . -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "obot.config.mcpNamespace" . }}
  {{- with .Values.mcpNamespace.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "obot.labels" . | nindent 4 }}
    {{- if .Values.mcpNamespace.podSecurity.enabled }}
    pod-security.kubernetes.io/enforce: {{ .Values.mcpNamespace.podSecurity.enforce }}
    pod-security.kubernetes.io/enforce-version: {{ .Values.mcpNamespace.podSecurity.enforceVersion | quote }}
    pod-security.kubernetes.io/audit: {{ .Values.mcpNamespace.podSecurity.audit }}
    pod-security.kubernetes.io/audit-version: {{ .Values.mcpNamespace.podSecurity.auditVersion | quote }}
    pod-security.kubernetes.io/warn: {{ .Values.mcpNamespace.podSecurity.warn }}
    pod-security.kubernetes.io/warn-version: {{ .Values.mcpNamespace.podSecurity.warnVersion | quote }}
    {{- end }}
{{- range .Values.mcpImagePullSecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ include "obot.config.mcpNamespace" $ }}
  labels:
    {{- include "obot.labels" $ | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"email\":\"%s\",\"auth\":\"%s\"}}}" .registry .username .password .email (printf "%s:%s" .username .password | b64enc) | b64enc }}
{{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ include "obot.config.mcpNamespace" . }}
  name: obot-mcp-role
  labels:
    {{- include "obot.labels" . | nindent 4 }}
rules:
  # access to leases for leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "services", "persistentvolumeclaims", "configmaps"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["networking.aviatrix.com"]
    resources: ["firewallpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Retire workloads left by the removed Hosted Agent backend.
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  # Read quota limits for MCP capacity reporting and remove legacy agent pools.
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list", "watch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-obot-agent-cleanup
rules:
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-obot-agent-cleanup
subjects:
  - kind: ServiceAccount
    name: {{ include "obot.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-obot-agent-cleanup
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: {{ include "obot.config.mcpNamespace" . }}
  name: obot-mcp-rolebinding
  labels:
    {{- include "obot.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "obot.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: obot-mcp-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ .Release.Namespace }}
  name: obot-runtime-role
  labels:
    {{- include "obot.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: {{ .Release.Namespace }}
  name: obot-runtime-rolebinding
  labels:
    {{- include "obot.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "obot.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: obot-runtime-role
  apiGroup: rbac.authorization.k8s.io

{{- if .Values.mcpNamespace.resourceQuota }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: obot-mcp-resourcequota
  namespace: {{ include "obot.config.mcpNamespace" . }}
spec:
  {{- toYaml .Values.mcpNamespace.resourceQuota | nindent 2 }}
{{- end }}
{{- end }}
