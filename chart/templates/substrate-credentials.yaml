{{- if .Values.substrate.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "obot.fullname" . }}-egress-credentials
  labels:
    {{- include "obot.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "obot.selectorLabels" . | nindent 4 }}
  ports:
    - name: credentials
      port: 8444
      targetPort: 8444
{{- end }}
