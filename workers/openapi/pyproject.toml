[project]
name = "obot-openapi-worker"
version = "0.1.0"
description = "Bounded multi-snapshot OpenAPI execution worker"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==3.4.7",
    "httpx==0.28.1",
    "starlette==1.0.1",
    "uvicorn==0.37.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openapi_worker"]
