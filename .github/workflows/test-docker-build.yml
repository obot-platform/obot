name: Test Docker Build

permissions:
  contents: read
  id-token: write

on:
  pull_request:
    branches:
      - main
      - 'feat/*'
    paths-ignore:
      - docs/**
      - chart/**
      - .claude/**
      - adr/**
      - '*.md'

jobs:
  build:
    runs-on: depot-ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Depot
        uses: depot/setup-action@v1

      - name: Build Docker Image
        uses: depot/build-push-action@v1
        with:
          project: bbqjs4tj1g
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_IMAGE=ghcr.io/obot-platform/obot/base:latest

      - name: Load AMD64 image for embedded PostgreSQL tests
        uses: depot/build-push-action@v1
        with:
          project: bbqjs4tj1g
          context: .
          platforms: linux/amd64
          load: true
          tags: obot:embedded-postgres-test
          build-args: |
            BASE_IMAGE=ghcr.io/obot-platform/obot/base:latest

      - name: Test embedded PostgreSQL startup and migration
        timeout-minutes: 15
        run: bash tools/test-embedded-postgres.sh obot:embedded-postgres-test

      - name: Upload embedded PostgreSQL test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: embedded-postgres-test-logs
          path: /tmp/obot-embedded-postgres-*/logs/
