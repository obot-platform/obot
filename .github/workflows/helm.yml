name: Helm Chart

permissions:
  contents: read
  packages: read

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/helm.yml
      - chart/**
      - tools/test-model-proxy-chart.sh
      - tools/test-substrate-chart.sh
  pull_request:
    branches:
      - main
      - 'feat/*'
    paths:
      - .github/workflows/helm.yml
      - chart/**
      - tools/test-model-proxy-chart.sh
      - tools/test-substrate-chart.sh

jobs:
  lint:
    runs-on: depot-ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint chart --set dev.useEmbeddedDb=true

      - name: Verify model proxy URL configuration
        run: bash tools/test-model-proxy-chart.sh

      - name: Install YAML parser
        run: python3 -m pip install PyYAML==6.0.2

      - name: Verify Substrate chart
        run: bash tools/test-substrate-chart.sh

      - name: Render Helm chart
        run: helm template obot chart --namespace obot --set dev.useEmbeddedDb=true

  build:
    runs-on: depot-ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Render chart
        run: |
          helm template test-release ./chart --set dev.useEmbeddedDb=true > rendered.yaml
          helm template test-release ./chart --set dev.useEmbeddedDb=true --set substrate.enabled=true --set substrate.image.repository=registry.example.com/substrate --set config.OBOT_SERVER_SUBSTRATE_SNAPSHOT_LOCATION=s3://ci-snapshots --include-crds > rendered-substrate.yaml

      - name: Log in to GitHub Packages
        run: echo "${{ github.token }}" | docker login ghcr.io -u ${GITHUB_ACTOR} --password-stdin
      - uses: docker://ghcr.io/yannh/kubeconform:v0.8.0
        with:
          entrypoint: "/kubeconform"
          args: "-summary -output json rendered.yaml"

      - name: Validate Substrate Kubernetes resources
        uses: docker://ghcr.io/yannh/kubeconform:v0.8.0
        with:
          entrypoint: "/kubeconform"
          # Upstream CRDs are checked in verbatim; kubeconform has no schemas
          # for CRDs or Substrate custom resources.
          args: "-kubernetes-version 1.35.0 -skip CustomResourceDefinition,SandboxConfig -summary -output json rendered-substrate.yaml"

      - name: Build Helm chart package
        run: |
          mkdir -p packaged
          helm package chart --destination packaged

      - name: Verify Helm chart package
        run: test -f packaged/*.tgz
