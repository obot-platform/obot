name: Run Tests on Pull Request

on:
  pull_request:
    branches:
      - main
      - 'feat/*'

jobs:
  test:
    runs-on: ubuntu-latest

    # The PostgreSQL tests skip without OBOT_TEST_POSTGRES_DSN. They cover the locking that SQLite does not exercise.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: obot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d obot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Dependencies
        run: |
          go mod download

      - name: Run Tests
        run: |
          make test
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OBOT_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/obot_test?sslmode=disable

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Integration Tests
        run: make test-integration
