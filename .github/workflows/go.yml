name: go

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'feat/*'
    # Workflows for the ignored paths run their own job named lint, which branch protection requires.
    paths-ignore:
      - chart/**
      - docs/**
      - ui/user/**

jobs:
  lint:
    runs-on: depot-ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      # golangci-lint caches per package by content hash, so restoring an older cache is safe.
      - name: Cache golangci-lint
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yaml') }}-${{ github.sha }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yaml') }}-
            golangci-lint-${{ runner.os }}-

      - name: Validate Go Code
        run: make validate-go-code
