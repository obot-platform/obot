openapi: 3.1.0
info:
  title: Users
  version: '1.0'
servers:
  - url: /relative
  - url: https://api.example.com/v1
paths:
  /users:
    get:
      operationId: listUsers
      summary: List users
      responses:
        '200':
          description: Users
    post:
      operationId: createUser
      tags: [internal]
      responses:
        '201':
          description: Created
  /users/{id}:
    delete:
      operationId: deleteUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
